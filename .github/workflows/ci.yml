name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

# A newer push to the same branch cancels the run still in progress.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  linux:
    name: Linux x86-64 · ${{ matrix.cxx }} · ${{ matrix.preset }}
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        cxx: [g++-14, clang++-18]
        preset: [asan, release]
        # ThreadSanitizer: one compiler is enough to find data races in our code.
        include:
          - cxx: clang++-18
            preset: tsan
    env:
      CXX: ${{ matrix.cxx }}
      # Fails the kernel tests if this runner can't run the AVX2 path, instead of silently
      # testing only the scalar kernels.
      VECDEX_EXPECT_ISA: avx2
    steps:
      - uses: actions/checkout@v7

      - name: Restore siftsmall
        id: siftsmall
        uses: actions/cache@v6
        with:
          path: data/siftsmall
          key: siftsmall-b8f1e59b

      - name: Download siftsmall
        if: steps.siftsmall.outputs.cache-hit != 'true'
        run: scripts/download_siftsmall.sh

      # Recent Ubuntu kernels randomize mmap addresses with more bits than the sanitizer
      # runtimes expect, which makes ASan and TSan crash at startup.
      - name: Make the kernel sanitizer-compatible
        if: matrix.preset != 'release'
        run: sudo sysctl vm.mmap_rnd_bits=28

      - name: Configure, build and test
        run: cmake --workflow --preset ${{ matrix.preset }}

      - name: Smoke-run the benchmarks (one iteration each; CI timings are too noisy to record)
        if: matrix.preset == 'release'
        run: build/release/bench/vecdex_bench --benchmark_min_time=1x

  valgrind:
    name: Linux x86-64 · Valgrind memcheck
    runs-on: ubuntu-24.04
    env:
      CXX: g++-14
    steps:
      - uses: actions/checkout@v7

      - name: Restore siftsmall
        id: siftsmall
        uses: actions/cache@v6
        with:
          path: data/siftsmall
          key: siftsmall-b8f1e59b

      - name: Download siftsmall
        if: steps.siftsmall.outputs.cache-hit != 'true'
        run: scripts/download_siftsmall.sh

      - name: Install Valgrind
        run: sudo apt-get update && sudo apt-get install --yes valgrind

      - name: "Build (Debug, no sanitizers: Valgrind and ASan can't be combined)"
        run: |
          cmake --preset debug
          cmake --build --preset debug

      # Catches reads of uninitialized memory, which ASan doesn't detect. Skips the two tests that
      # compare recall over many parallel builds: memcheck runs threads one at a time, about 90x
      # slower than native, so they would add over 15 minutes. Parallel add and batch search
      # still run here, in the smaller HnswParallel and HnswBatch tests.
      - name: Run the tests under memcheck
        run: >
          valgrind --error-exitcode=1 --leak-check=full
          --errors-for-leak-kinds=definite,indirect --track-origins=yes
          build/debug/tests/vecdex_tests --gtest_filter=-HnswParallel.MatchesSerialRecall*

  fuzz:
    name: Linux x86-64 · clang++-18 · libFuzzer (HnswIndex::load)
    runs-on: ubuntu-24.04
    env:
      CXX: clang++-18
    steps:
      - uses: actions/checkout@v7

      # As in the sanitizer jobs: ASan crashes at startup under the kernel's default mmap
      # randomization.
      - name: Make the kernel sanitizer-compatible
        run: sudo sysctl vm.mmap_rnd_bits=28

      - name: Build the fuzzer (Debug, ASan + UBSan, libFuzzer)
        run: |
          cmake -S . -B build/fuzz -G Ninja -DCMAKE_BUILD_TYPE=Debug \
                -DVECDEX_SANITIZE=ON -DVECDEX_BUILD_FUZZERS=ON
          cmake --build build/fuzz --target vecdex_load_fuzzer

      # A smoke run, not a campaign: a fixed seed and input count, so every run tries about the
      # same inputs and a failure points at the change, not at luck. It starts from the valid
      # indexes the fuzzer writes into an empty corpus. Longer runs stay local (see
      # tests/load_fuzzer.cpp).
      - name: Fuzz the index loader
        run: |
          mkdir -p build/fuzz/corpus build/fuzz/findings
          build/fuzz/tests/vecdex_load_fuzzer build/fuzz/corpus -seed=1 -runs=200000 \
              -artifact_prefix=build/fuzz/findings/

      # The input that failed, to reproduce it locally: vecdex_load_fuzzer <file>.
      - name: Keep the failing input
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: fuzz-findings
          path: build/fuzz/findings/
          if-no-files-found: ignore

  macos:
    name: macOS arm64 · Apple clang · ${{ matrix.preset }}
    runs-on: macos-15
    strategy:
      fail-fast: false
      matrix:
        preset: [asan, release]
    env:
      VECDEX_EXPECT_ISA: neon
    steps:
      - uses: actions/checkout@v7

      - name: Restore siftsmall
        id: siftsmall
        uses: actions/cache@v6
        with:
          path: data/siftsmall
          key: siftsmall-b8f1e59b

      - name: Download siftsmall
        if: steps.siftsmall.outputs.cache-hit != 'true'
        run: scripts/download_siftsmall.sh

      - name: Configure, build and test
        run: cmake --workflow --preset ${{ matrix.preset }}

      - name: Smoke-run the benchmarks (one iteration each)
        if: matrix.preset == 'release'
        run: build/release/bench/vecdex_bench --benchmark_min_time=1x

  python:
    name: Python bindings · ${{ matrix.platform }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # Python 3.13 on both systems, plus the oldest version pyproject.toml accepts and the
        # newest release, on Linux.
        include:
          - os: ubuntu-24.04
            platform: Linux x86-64 · g++-14
            cxx: g++-14
            python: "3.13"
          - os: macos-15
            platform: macOS arm64 · Apple clang
            cxx: clang++
            python: "3.13"
          - os: ubuntu-24.04
            platform: Linux x86-64 · g++-14 · Python 3.10
            cxx: g++-14
            python: "3.10"
          - os: ubuntu-24.04
            platform: Linux x86-64 · g++-14 · Python 3.14
            cxx: g++-14
            python: "3.14"
    env:
      CXX: ${{ matrix.cxx }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}

      - name: Restore siftsmall
        id: siftsmall
        uses: actions/cache@v6
        with:
          path: data/siftsmall
          key: siftsmall-b8f1e59b

      - name: Download siftsmall
        if: steps.siftsmall.outputs.cache-hit != 'true'
        run: scripts/download_siftsmall.sh

      # pip builds in a fresh environment, the way a user's install does. Warnings are errors
      # here, as in the C++ jobs; pyproject.toml turns that off for users' installs.
      - name: Install the package with its test dependencies
        run: >
          python -m pip install --verbose
          --config-settings=cmake.define.VECDEX_WARNINGS_AS_ERRORS=ON ".[test]"

      - name: Run the Python tests
        run: python -m pytest

      - name: Smoke-run the binding benchmark (CI timings are too noisy to record)
        run: python python/bench/binding_overhead.py data/siftsmall siftsmall --ef 16,64 --repeats 1
